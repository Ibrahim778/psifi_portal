    <!-- Payment Gateway Integration JavaScript -->
    <script>
        // Helper: try to read amount from DOM span with data-id="TotalFee"
        function getTotalFromDOM() {
            try {
                const el = document.querySelector('[data-id="TotalFee"]');
                if (!el) return null;
                const raw = (el.innerText || el.textContent || "").trim();
                let digits = "";
                for (let i = 0; i < raw.length; i++) {
                    const c = raw[i];
                    if (c >= "0" && c <= "9") digits += c;
                }
                return digits ? parseInt(digits, 10) : null;
            } catch (_) {
                return null;
            }
        }

        // Calculate TotalFee using server-aligned rules (EB cutoff: Nov 20 current year)
        function calculateTotalFee(entry) {
            try {
                const toNumber = (val) => {
                    if (val === null || val === undefined) return 0;
                    if (typeof val === "number" && !Number.isNaN(val)) return val;
                    if (typeof val === "string") {
                        const cleaned = val.replace(/[^0-9.-]/g, "");
                        return cleaned ? parseFloat(cleaned) : 0;
                    }
                    return 0;
                };

                const get = (obj, path) => {
                    try {
                        const parts = path.split(".");
                        let cur = obj;
                        for (const p of parts) {
                            if (cur && typeof cur === "object" && p in cur) {
                                cur = cur[p];
                            } else {
                                return undefined;
                            }
                        }
                        return cur;
                    } catch (_) {
                        return undefined;
                    }
                };

                // TotalNights = Nights2 + Nights22 + Nights3 + TeamMember3Information.Nights4 + TeamMember4Information.Nights5
                const nights2 = toNumber(entry.Nights2);
                const nights22 = toNumber(entry.Nights22);
                const nights3 = toNumber(entry.Nights3);
                const nights4 = toNumber(
                    get(entry, "TeamMember3Information.Nights4")
                );
                const nights5 = toNumber(
                    get(entry, "TeamMember4Information.Nights5")
                );
                const totalNights = nights2 + nights22 + nights3 + nights4 + nights5;

                // Registration phase based on cutoff Nov 20 of current year
                const submittedRaw =
                    get(entry, "Entry.DateSubmitted") ||
                    entry.DateSubmitted ||
                    entry.Submitted ||
                    null;
                const submitted = submittedRaw ? new Date(submittedRaw) : null;
                const now = new Date();
                const cutoff = new Date(`${now.getFullYear()}-11-20T23:59:59`);
                let registrationPhase = "Regular Phase";
                if (submitted instanceof Date && !Number.isNaN(submitted.getTime())) {
                    registrationPhase =
                        submitted.getTime() <= cutoff.getTime()
                            ? "Early Bird"
                            : "Regular Phase";
                }

                // EventsPrice by phase + number of events, multiplied by team size (3/4/5)
                const eventsChoice = (
                    entry.SelectTheNumberOfEventsYouWishToParticipateIn || ""
                ).toString();
                const teamSizeStr = (entry.TeamSize || "").toString();
                const teamCount = teamSizeStr.startsWith("3")
                    ? 3
                    : teamSizeStr.startsWith("4")
                        ? 4
                        : teamSizeStr.startsWith("5")
                            ? 5
                            : 0;
                const isTwo = eventsChoice.startsWith("2");
                const isThree = eventsChoice.startsWith("3");
                let perPerson = 0;
                if (registrationPhase === "Early Bird") {
                    perPerson = isTwo ? 7500 : isThree ? 8500 : 0;
                } else {
                    perPerson = isTwo ? 8500 : isThree ? 9500 : 0;
                }
                const eventsPrice = perPerson * teamCount;

                // Accommodation: 1500 per night total (sum across delegates). Delegation: flat (EB=0, Regular=3500)
                const perNight = 1500;
                const accommodationPrice = totalNights * perNight;
                const delegationFee = registrationPhase === "Early Bird" ? 0 : 3500;

                const total = accommodationPrice + delegationFee + eventsPrice;
                console.log("Calculated TotalFee:", {
                    nights2,
                    nights22,
                    nights3,
                    nights4,
                    nights5,
                    totalNights,
                    phase: registrationPhase === "Early Bird" ? 1 : 2,
                    events: isTwo ? 2 : isThree ? 3 : 0,
                    teamCount,
                    perPerson,
                    perNight,
                    accommodationPrice,
                    delegationFee,
                    eventsPrice,
                    total,
                });

                return total;
            } catch (e) {
                console.error("Error calculating TotalFee:", e);
                return null;
            }
        }
        // After successful Cognito submission: save payment link (no redirect)
        // Using Cognito Forms client-side events API for seamless embed
        // Wait for Cognito to be available
        (function attachCognitoHandlers() {
            const maxAttempts = 20;
            let attempts = 0;

            const checkAndAttach = setInterval(function () {
                attempts++;

                if (
                    typeof Cognito !== "undefined" &&
                    typeof Cognito.on === "function"
                ) {
                    clearInterval(checkAndAttach);
                    console.log("Cognito API detected, attaching afterSubmit handler");

                    Cognito.on("afterSubmit", function (event) {
                        try {
                            // According to docs: event.data.entry contains the submitted entry
                            const entry =
                                event && event.data && event.data.entry
                                    ? event.data.entry
                                    : {};

                            try {
                                console.log("afterSubmit event triggered");
                                console.log("Entry keys:", Object.keys(entry || {}));
                            } catch (_) { }

                            // Send entry to our API (server will calculate total)
                            fetch("/api/create-payment/", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ entry: entry }),
                            })
                                .then((r) => r.json())
                                .then((res) => {
                                    try {
                                        console.log(
                                            "Payment created successfully:",
                                            res && res.payment_url
                                        );
                                    } catch (_) { }
                                })
                                .catch((err) => {
                                    console.error("Payment creation failed:", err);
                                });
                        } catch (e) {
                            console.error("afterSubmit handler error:", e);
                        }
                    });
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkAndAttach);
                    console.error(
                        "Cognito API not available after",
                        maxAttempts,
                        "attempts"
                    );
                }
            }, 200);
        })();
    </script>
    <script>
        const loadCognitoLink = async (requestObj) => {
            const resp = await fetch("/api/cognitoget", {
                method: "POST",
                body: JSON.stringify(requestObj),
                headers: {
                    "Content-Type": "application/json",
                },
            });
            let respObj = await resp.json();
            // return null;
            return respObj.hasOwnProperty("error") ? null : respObj.cognito_link.replace(/^.*\/\/[^\/]+/, '');  // return only path not domain
        };

        const saveCognitoLink = async (requestObj) => {
            const resp = await fetch("/api/cognitostore", {
                method: "POST",
                body: JSON.stringify(requestObj),
                headers: {
                    "Content-Type": "application/json",
                },
            });
            // console.log("Saving?")
            // console.log(resp.statusText);
        };

        // When the page loads, check if there's a saved Cognito URL
        window.addEventListener("load", async () => {

            let savedUrl = "";

            const user = localStorage.getItem("loginUser");
            const dbUrl = await loadCognitoLink({ user: user });
            if (!dbUrl) // It might be using the legacy system
            {
                savedUrl = localStorage.getItem("cognitoUrl");
                if(savedUrl) // Upload to db and remove local cookie
                {
                    saveCognitoLink({ user: user, cognito_link: savedUrl })
                    localStorage.removeItem("cognitoUrl");
                }
            }
            else savedUrl = dbUrl;

            // console.log("Using saved url:");
            // console.log(savedUrl)

            if (savedUrl && savedUrl !== document.location.href) {
                console.log("Redirecting to saved Cognito URL:", savedUrl);
                window.location.href = savedUrl;
            }
        });

        // Detect URL change
        let oldHref = document.location.href;

        setInterval(() => {
            console.log("interval: ");
            console.log("old: " + oldHref)
            console.log("current: " + document.location.href)
            if (oldHref !== document.location.href) {
                oldHref = document.location.href;
                console.log("heelllo?")
                
                //   localStorage.setItem("cognitoUrl", oldHref);
                
                // Save new URL in db
                saveCognitoLink({ user: localStorage.getItem("loginUser"), cognito_link: oldHref })
            }
        }, 1000);
    </script>
